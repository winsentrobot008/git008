<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>VOICE22 | 导演调音台</title>
    <style>
        :root { 
            --bg-dark: #0a0a12; 
            --card-bg: #141428; 
            --accent: #9c27b0; 
            --accent-light: #e040fb;
            --text: #e0e0e0; 
            --text-muted: #8888a0;
            --green: #00e676;
            --blue: #2979ff;
        }
        
        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; 
            background: var(--bg-dark); 
            color: var(--text); 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box;
        }

        .header-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2rem;
            background: linear-gradient(45deg, #ab47bc, #2979ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .container { 
            max-width: 1400px; 
            margin: auto; 
            display: grid; 
            grid-template-columns: 1.8fr 1.2fr; 
            gap: 24px; 
        }

        .card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 24px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.4); 
            border: 1px solid #22223c;
        }

        h2 { 
            color: var(--accent-light); 
            border-bottom: 2px solid #222244; 
            padding-bottom: 12px; 
            margin-top: 0; 
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select {
            width: 100%;
            padding: 12px;
            background: #1c1c34;
            color: #fff;
            border: 1px solid #3d3d66;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        select:focus {
            border-color: var(--accent-light);
        }

        textarea { 
            width: 100%; 
            height: 180px; 
            background: #1c1c34; 
            color: #fff; 
            border: 1px solid #3d3d66; 
            border-radius: 8px; 
            padding: 12px; 
            font-size: 15px; 
            font-family: 'Courier New', Courier, monospace;
            resize: vertical; 
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--accent-light);
        }
        
        /* 调音台核心样式 */
        .mixer { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            margin-top: 15px;
        }

        .channel { 
            border: 1px solid #2d2d4d; 
            border-radius: 10px; 
            padding: 18px; 
            background: #181830; 
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .channel:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(156, 39, 176, 0.15);
        }

        .channel h3 { 
            text-align: center; 
            margin: 0 0 20px 0; 
            color: #fff; 
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .knob-group { 
            margin-bottom: 18px; 
        }

        .knob-group label { 
            display: block; 
            font-size: 13px; 
            color: var(--text-muted); 
            margin-bottom: 8px; 
        }

        .slider-container { 
            display: flex; 
            align-items: center; 
        }

        input[type=range] { 
            flex-grow: 1; 
            margin-right: 12px; 
            -webkit-appearance: none; 
            height: 6px; 
            background: #2c2c4e; 
            border-radius: 3px; 
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            width: 18px; 
            height: 18px; 
            background: var(--accent-light); 
            border-radius: 50%; 
            cursor: pointer; 
            box-shadow: 0 0 8px var(--accent);
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .value-display { 
            min-width: 45px; 
            text-align: right; 
            font-weight: bold; 
            color: var(--green); 
            font-family: monospace;
            font-size: 14px;
        }
        
        /* 播放器与终端 */
        .player-box { 
            text-align: center; 
            padding: 24px; 
            background: #121224; 
            border-radius: 10px; 
            margin-top: 15px; 
            border: 1px solid #1f1f3a;
        }

        audio { 
            width: 100%; 
            margin-top: 10px; 
            border-radius: 8px;
        }

        #terminal-output { 
            height: 380px; 
            overflow-y: auto; 
            background: #05050d; 
            padding: 15px; 
            border-radius: 8px; 
            font-family: 'Consolas', 'Courier New', monospace; 
            font-size: 13px; 
            white-space: pre-wrap; 
            border: 1px solid #1a1a35;
            color: #81c784;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        /* 统一大按钮 */
        .main-action-btn { 
            width: 100%; 
            padding: 16px; 
            margin-top: 24px; 
            border: none; 
            border-radius: 8px; 
            background: linear-gradient(45deg, #7b1fa2, #9c27b0); 
            color: white; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(156, 39, 176, 0.4);
            transition: background 0.2s, transform 0.1s;
        }

        .main-action-btn:hover { 
            background: linear-gradient(45deg, #8e24aa, #ab47bc); 
            transform: translateY(-1px);
        }

        .main-action-btn:disabled { 
            background: #2a2a40; 
            color: #666;
            box-shadow: none;
            cursor: wait; 
        }

        /* 专业多音轨切换按钮 */
        .track-selector-btn {
            padding: 10px; 
            font-size: 12px; 
            margin: 0; 
            background: #1c1c34; 
            border: 1px solid #3d3d66;
            color: #aaa;
            border-radius: 6px;
            width: auto; 
            flex-grow: 1;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .track-selector-btn:hover:not(:disabled) {
            border-color: var(--accent-light);
            color: #fff;
        }
        .track-selector-btn.active {
            background: linear-gradient(135deg, #7b1fa2, #1565c0);
            border-color: var(--accent-light);
            color: #fff;
            box-shadow: 0 0 10px rgba(224, 64, 251, 0.5);
        }
        .track-selector-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* 变声状态标签 */
        .status-badge {
            background: #0f0f1f;
            border: 1px solid #2d2d4d;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 11px;
            color: #00e676;
            text-align: center;
            font-family: monospace;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1 class="header-title">🎛️ VOICE22 导演调音台</h1>
    <div class="container">
        <!-- 左列：剧本与调音台 -->
        <div class="card">
            <h2>📜 剧本编辑 (Script Editor)</h2>
            <div class="knob-group">
                <label>🎭 导演推荐搞笑模板快捷加载</label>
                <select id="template-select" onchange="loadTemplate()">
                    <option value="" disabled selected>-- 请选择一个搞笑剧本模板 --</option>
                    <option value="rent">🏡《催租风波》（包租婆 vs 卑微房客）</option>
                    <option value="interview">👔《面试显眼包》（严肃面试官 vs 狂妄求职者）</option>
                    <option value="os">🧠《深夜内心OS》（表面客套 vs 真实内心戏）</option>
                </select>
            </div>
            <textarea id="script-input"></textarea>
            
            <h2>🎚️ 音色调音台 (Director's Mixer)</h2>
            <div class="mixer">
                <!-- 角色A 通道 -->
                <div class="channel">
                    <h3>角色 A (老板/正派)</h3>
                    
                    <!-- 声音源选择模式 -->
                    <div class="knob-group">
                        <label>🔊 声音生成源模式</label>
                        <select id="modeA" onchange="toggleSourceMode('A')" style="margin-bottom: 10px;">
                            <option value="tts" selected>🤖 AI 文本朗读模式 (Edge-TTS)</option>
                            <option value="raw">🎙️ 本地原声变调模式 (DSP)</option>
                        </select>
                    </div>

                    <!-- AI 声优选择下拉框 -->
                    <div class="knob-group" id="tts-select-groupA">
                        <label>🎭 微软 AI 拟真声优选择</label>
                        <select id="voiceOptA">
                            <option value="zh-CN-YunxiNeural" selected>🙋‍♂️ 云希 (成熟温暖男声)</option>
                            <option value="zh-CN-YunjianNeural">🙋‍♂️ 云健 (运动活力男声)</option>
                            <option value="zh-CN-YunyangNeural">🙋‍♂️ 云扬 (专业新闻男声)</option>
                            <option value="zh-HK-WanLungNeural">🙋‍♂️ 粤语男声 (香港湾龙)</option>
                        </select>
                    </div>

                    <!-- 录音组件 (默认在 AI 模式下隐藏) -->
                    <div class="knob-group" id="raw-record-groupA" style="border: 1px dashed #444; padding: 10px; border-radius: 6px; margin-bottom: 15px; display: none;">
                        <label>🎙️ 本人声音录入 / 上传 (voice_A)</label>
                        <div style="display: flex; gap: 8px; margin-top: 5px;">
                            <button id="recordA" onclick="toggleRecord('A')" style="padding: 6px; margin: 0; font-size: 12px; background: #c62828; width: auto; flex-grow: 1; border: none; border-radius: 4px; color: white; cursor: pointer;">🔴 录音</button>
                            <input type="file" id="uploadA" accept=".wav,audio/wav,audio/mpeg,audio/m4a,.m4a,.mp3" onchange="uploadRef('A')" style="display: none;">
                            <button onclick="document.getElementById('uploadA').click()" style="padding: 6px; margin: 0; font-size: 12px; background: #1565c0; width: auto; flex-grow: 1; border: none; border-radius: 4px; color: white; cursor: pointer;">📁 上传</button>
                        </div>
                        <audio id="refPlayerA" controls style="width: 100%; margin-top: 8px; display: block;"></audio>
                    </div>

                    <div class="knob-group">
                        <label>年龄轴 (小孩 ←→ 老人)</label>
                        <div class="slider-container">
                            <input type="range" id="ageA" min="5" max="80" value="45" step="1" oninput="updateSliders()">
                            <span class="value-display" id="ageAVal">45</span>
                        </div>
                    </div>
                    <div class="knob-group">
                        <label>质感 (尖细 ←→ 浑厚)</label>
                        <div class="slider-container">
                            <input type="range" id="toneA" min="0" max="1" value="0.8" step="0.01" oninput="updateSliders()">
                            <span class="value-display" id="toneAVal">0.80</span>
                        </div>
                    </div>
                    <div class="knob-group">
                        <label>情绪强度 (平静 ←→ 激昂)</label>
                        <div class="slider-container">
                            <input type="range" id="emotionA" min="0" max="1" value="0.9" step="0.01" oninput="updateSliders()">
                            <span class="value-display" id="emotionAVal">0.90</span>
                        </div>
                    </div>

                    <!-- 动态音色状态标志 -->
                    <div class="status-badge" id="badgeA">音色状态：成熟男声音色</div>
                </div>

                <!-- 角色B 通道 -->
                <div class="channel">
                    <h3>角色 B (员工/OS)</h3>
                    
                    <!-- 声音源选择模式 -->
                    <div class="knob-group">
                        <label>🔊 声音生成源模式</label>
                        <select id="modeB" onchange="toggleSourceMode('B')" style="margin-bottom: 10px;">
                            <option value="tts" selected>🤖 AI 文本朗读模式 (Edge-TTS)</option>
                            <option value="raw">🎙️ 本地原声变调模式 (DSP)</option>
                        </select>
                    </div>

                    <!-- AI 声优选择下拉框 -->
                    <div class="knob-group" id="tts-select-groupB">
                        <label>🎭 微软 AI 拟真声优选择</label>
                        <select id="voiceOptB">
                            <option value="zh-CN-XiaoxiaoNeural" selected>🙋‍♀️ 晓晓 (温柔亲切女声)</option>
                            <option value="zh-CN-XiaoyiNeural">🙋‍♀️ 晓伊 (活泼可爱女声)</option>
                            <option value="zh-CN-ShaoxuanNeural">🙋‍♂️ 绍轩 (沉稳儒雅男声)</option>
                            <option value="zh-HK-HiuGaaiNeural">🙋‍♀️ 粤语女声 (香港晓佳)</option>
                        </select>
                    </div>

                    <!-- 录音组件 (默认在 AI 模式下隐藏) -->
                    <div class="knob-group" id="raw-record-groupB" style="border: 1px dashed #444; padding: 10px; border-radius: 6px; margin-bottom: 15px; display: none;">
                        <label>🎙️ 本人声音录入 / 上传 (voice_B)</label>
                        <div style="display: flex; gap: 8px; margin-top: 5px;">
                            <button id="recordB" onclick="toggleRecord('B')" style="padding: 6px; margin: 0; font-size: 12px; background: #c62828; width: auto; flex-grow: 1; border: none; border-radius: 4px; color: white; cursor: pointer;">🔴 录音</button>
                            <input type="file" id="uploadB" accept=".wav,audio/wav,audio/mpeg,audio/m4a,.m4a,.mp3" onchange="uploadRef('B')" style="display: none;">
                            <button onclick="document.getElementById('uploadB').click()" style="padding: 6px; margin: 0; font-size: 12px; background: #1565c0; width: auto; flex-grow: 1; border: none; border-radius: 4px; color: white; cursor: pointer;">📁 上传</button>
                        </div>
                        <audio id="refPlayerB" controls style="width: 100%; margin-top: 8px; display: block;"></audio>
                    </div>

                    <div class="knob-group">
                        <label>年龄轴 (小孩 ←→ 老人)</label>
                        <div class="slider-container">
                            <input type="range" id="ageB" min="5" max="80" value="25" step="1" oninput="updateSliders()">
                            <span class="value-display" id="ageBVal">25</span>
                        </div>
                    </div>
                    <div class="knob-group">
                        <label>质感 (尖细 ←→ 浑厚)</label>
                        <div class="slider-container">
                            <input type="range" id="toneB" min="0" max="1" value="0.3" step="0.01" oninput="updateSliders()">
                            <span class="value-display" id="toneBVal">0.30</span>
                        </div>
                    </div>
                    <div class="knob-group">
                        <label>情绪强度 (平静 ←→ 激昂)</label>
                        <div class="slider-container">
                            <input type="range" id="emotionB" min="0" max="1" value="0.2" step="0.01" oninput="updateSliders()">
                            <span class="value-display" id="emotionBVal">0.20</span>
                        </div>
                    </div>

                    <!-- 动态音色状态标志 -->
                    <div class="status-badge" id="badgeB">音色状态：尖细萝莉音色</div>
                </div>
            </div>
            <button id="generateBtn" class="main-action-btn" onclick="generateAudio()">▶️ 生成音频 (参数化)</button>
        </div>

        <!-- 右列：播放器与终端 -->
        <div class="card">
            <h2>🎧 预览与输出 (Preview & Player)</h2>
            <div class="player-box">
                <!-- 专业发光推子多音轨选择器 -->
                <div style="margin-bottom: 20px; display: flex; gap: 8px; justify-content: center;">
                    <button id="playA_btn" class="track-selector-btn" onclick="switchTrack('A')" disabled>🎭 听 角色A 分轨</button>
                    <button id="playB_btn" class="track-selector-btn" onclick="switchTrack('B')" disabled>🎭 听 角色B 分轨</button>
                    <button id="playMerged_btn" class="track-selector-btn" onclick="switchTrack('Merged')" disabled>🎬 听 全剧本合流</button>
                </div>
                <audio id="player" controls></audio>
                <div id="current-track-label" style="margin-top: 15px; font-size: 13px; color: #00e676; font-weight: bold; text-shadow: 0 0 5px rgba(0,230,118,0.3);">🔧 等待生成音频文件...</div>
            </div>
            <h2>📊 执行终端 (Execution Terminal)</h2>
            <div id="terminal-output">系统就绪。调整滑块或录音后点击生成...</div>
        </div>
    </div>

<script>
    const terminal = document.getElementById('terminal-output');
    const player = document.getElementById('player');
    const generateBtn = document.getElementById('generateBtn');

    // 1. 动态音效滑块检测逻辑
    function updateSliders() {
        const sliders = document.querySelectorAll('input[type="range"]');
        sliders.forEach(slider => {
            const valDisplay = document.getElementById(slider.id + 'Val');
            if (valDisplay) {
                valDisplay.innerText = parseFloat(slider.value).toFixed(2);
            }
        });

        // 动态计算 A 变声状态
        const ageA = parseInt(document.getElementById('ageA').value);
        const toneA = parseFloat(document.getElementById('toneA').value);
        const badgeA = document.getElementById('badgeA');
        
        let descA = "音色：";
        if (ageA < 20) descA += "小正太";
        else if (ageA > 55) descA += "老爷爷";
        else descA += "青年男声";

        if (toneA < 0.35) descA += " (极细公鸭嗓 🔊)";
        else if (toneA > 0.75) descA += " (深沉浑厚低音炮 🔊)";
        else descA += " (中规中矩音色)";
        badgeA.innerText = descA;

        // 动态计算 B 变声状态
        const ageB = parseInt(document.getElementById('ageB').value);
        const toneB = parseFloat(document.getElementById('toneB').value);
        const badgeB = document.getElementById('badgeB');
        
        let descB = "音色：";
        if (ageB < 20) descB += "小萝莉";
        else if (ageB > 55) descB += "老奶奶";
        else descB += "青年女声";

        if (toneB < 0.35) descB += " (极尖锐高音 🔊)";
        else if (toneB > 0.75) descB += " (磁性御姐低音 🔊)";
        else descB += " (自然对话音色)";
        badgeB.innerText = descB;
    }

    // 初始化运行一次
    updateSliders();

    // 2. 搞笑模板数据源
    const templates = {
        rent: {
            script: `[00:00-00:04] [A] 小王！这都几号了？房租还交不交了？！\n[00:04-00:08] [B] 包租婆，您宽限两天，我下周发工资一准给您送去。\n[00:08-00:12] [A] 下周复下周！你当我是慈善机构啊？今天不交就卷铺盖滚蛋！\n[00:12-00:16] [B] （内心OS）催催催，就知道催，祝你明天打麻将输光光！`,
            presets: {
                ageA: 55, toneA: 0.20, emotionA: 0.95,
                ageB: 22, toneB: 0.70, emotionB: 0.15
            }
        },
        interview: {
            script: `[00:00-00:04] [A] 简单介绍下自己，为什么你觉得你适合我们架构总监的岗位？\n[00:04-00:08] [B] 报告面试官！我最大的优势就是特别能吹！能把单机项目吹成 AGI 联邦！\n[00:08-00:12] [A] 噢？那你的抗压能力怎么样？我们这里需要 24 小时待命。\n[00:12-00:16] [B] 放心！我根本没有睡眠需求，我甚至能跟 AI 一起防冻结！`,
            presets: {
                ageA: 48, toneA: 0.80, emotionA: 0.40,
                ageB: 20, toneB: 0.30, emotionB: 0.90
            }
        },
        os: {
            script: `[00:00-00:04] [A] 哎呀李总，您这套西装真帅，显得年轻了至少二十岁！\n[00:04-00:08] [B] （内心OS）哼，马屁精，其实这是我十年前买的旧款。\n[00:08-00:12] [A] 哪里哪里，还是李总您底子好，穿什么都像走秀。\n[00:12-00:16] [B] （内心OS）救命啊，我的脚趾已经抠出了一整套 AGI 智能工厂！`,
            presets: {
                ageA: 30, toneA: 0.50, emotionA: 0.50,
                ageB: 30, toneB: 0.10, emotionB: 0.80
            }
        }
    };

    function loadTemplate() {
        const select = document.getElementById('template-select');
        const tpl = templates[select.value];
        if (!tpl) return;

        // 填充剧本
        document.getElementById('script-input').value = tpl.script;
        log(`[Template] 已物理加载剧本模板: ${select.value}`);

        // 一键应用调音台滑块参数
        for (const [id, val] of Object.entries(tpl.presets)) {
            const slider = document.getElementById(id);
            if (slider) {
                slider.value = val;
            }
        }
        updateSliders();
        log(`[Template] 调音台滑块已自动推荐到最佳搞笑参数配置！`);
    }

    // 加载剧本
    fetch('/api/script').then(res => res.text()).then(txt => document.getElementById('script-input').value = txt);

    function log(msg) {
        const time = new Date().toLocaleTimeString();
        terminal.innerHTML += `[${time}] ${msg}\n`;
        terminal.scrollTop = terminal.scrollHeight;
    }

    async function generateAudio() {
        generateBtn.disabled = true;
        generateBtn.innerText = '正在物理变调合并中...';
        log('开始生成音频 (参数化多轨变调模式)...');

        // 收集调音台参数
        const job_config = {
            script: document.getElementById('script-input').value,
            voice_profiles: {
                "A": {
                    age: parseInt(document.getElementById('ageA').value),
                    gender_tone: parseFloat(document.getElementById('toneA').value),
                    emotion: parseFloat(document.getElementById('emotionA').value),
                    mode: document.getElementById('modeA').value,
                    voice_opt: document.getElementById('voiceOptA').value
                },
                "B": {
                    age: parseInt(document.getElementById('ageB').value),
                    gender_tone: parseFloat(document.getElementById('toneB').value),
                    emotion: parseFloat(document.getElementById('emotionB').value),
                    mode: document.getElementById('modeB').value,
                    voice_opt: document.getElementById('voiceOptB').value
                }
            }
        };

        // 发送POST请求到后端API
        try {
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(job_config)
            });
            const result = await response.json();
            log(result.log);

            // 保存三轨全局地址
            window.audioTracks = {
                'A': '/output/' + result.a_only_mp3,
                'B': '/output/' + result.b_only_mp3,
                'Merged': '/output/' + result.latest_mp3
            };

            // 激活并亮起分轨选择按钮
            document.getElementById('playA_btn').disabled = false;
            document.getElementById('playB_btn').disabled = false;
            document.getElementById('playMerged_btn').disabled = false;

            // 默认加载合流
            switchTrack('Merged');
        } catch (error) {
            log('错误: ' + error);
        } finally {
            generateBtn.disabled = false;
            generateBtn.innerText = '▶️ 生成音频 (参数化)';
        }
    }

    // 切换音轨控制 (带高亮样式)
    function switchTrack(trackType) {
        if (!window.audioTracks || !window.audioTracks[trackType]) return;
        const player = document.getElementById('player');
        const labels = { 'A': '角色 A 的变声分轨', 'B': '角色 B 的变声分轨', 'Merged': '角色 A & B 完整剧情合流' };
        
        // 清理所有按钮的高亮状态
        document.getElementById('playA_btn').classList.remove('active');
        document.getElementById('playB_btn').classList.remove('active');
        document.getElementById('playMerged_btn').classList.remove('active');

        // 为当前点击的按钮附加高亮样式
        if (trackType === 'A') document.getElementById('playA_btn').classList.add('active');
        if (trackType === 'B') document.getElementById('playB_btn').classList.add('active');
        if (trackType === 'Merged') document.getElementById('playMerged_btn').classList.add('active');

        player.src = window.audioTracks[trackType] + '?t=' + new Date().getTime();
        player.load();
        
        document.getElementById('current-track-label').innerText = `当前正在播放：${labels[trackType]}`;
        log(`[Player] 切换加载音轨 -> ${labels[trackType]}`);
    }

    // HTML5 录音与物理上传逻辑
    let mediaRecorders = { A: null, B: null };
    let audioChunks = { A: [], B: [] };

    async function toggleRecord(speaker) {
        const btn = document.getElementById('record' + speaker);
        if (mediaRecorders[speaker] && mediaRecorders[speaker].state === 'recording') {
            // 停止录音
            mediaRecorders[speaker].stop();
            btn.innerText = '🔴 录音';
            btn.style.background = '#c62828';
            log(`[Voice_${speaker}] 录音停止，正在打包上传...`);
        } else {
            // 开始录音
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks[speaker] = [];
                const recorder = new MediaRecorder(stream);
                mediaRecorders[speaker] = recorder;

                recorder.ondataavailable = e => audioChunks[speaker].push(e.data);
                recorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks[speaker], { type: 'audio/wav' });
                    // 页面播放预览
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const refPlayer = document.getElementById('refPlayer' + speaker);
                    refPlayer.src = audioUrl;
                    refPlayer.style.display = 'block';

                    // 物理上传到服务器
                    const fileData = await audioBlob.arrayBuffer();
                    await uploadBlobToServer(fileData, speaker);
                };

                recorder.start();
                btn.innerText = '⏹️ 停止';
                btn.style.background = '#2e7d32';
                log(`[Voice_${speaker}] 正在录音，请对准麦克风说话...`);
            } catch (err) {
                log('无法获取麦克风权限: ' + err);
            }
        }
    }

    async function uploadRef(speaker) {
        const fileInput = document.getElementById('upload' + speaker);
        if (fileInput.files.length === 0) return;
        const file = fileInput.files[0];
        log(`[Voice_${speaker}] 正在读取本地上传文件: ${file.name}`);
        
        const fileData = await file.arrayBuffer();
        
        // 预览播放
        const refPlayer = document.getElementById('refPlayer' + speaker);
        refPlayer.src = URL.createObjectURL(file);
        refPlayer.style.display = 'block';

        await uploadBlobToServer(fileData, speaker);
    }

    async function uploadBlobToServer(arrayBuffer, speaker) {
        try {
            const res = await fetch('/api/upload_ref', {
                method: 'POST',
                headers: {
                    'Content-Type': 'audio/wav',
                    'X-Speaker': speaker
                },
                body: arrayBuffer
            });
            const text = await res.text();
            log(`[Voice_${speaker}] 服务器物理保存成功: assets/voices/voice_${speaker}_ref.wav`);
        } catch (e) {
            log(`[Error] 物理上传音频失败: ` + e);
        }
    }
    // 切换声音源输入 UI 控制
    function toggleSourceMode(speaker) {
        const mode = document.getElementById('mode' + speaker).value;
        const ttsGroup = document.getElementById('tts-select-group' + speaker);
        const rawGroup = document.getElementById('raw-record-group' + speaker);
        
        if (mode === 'tts') {
            ttsGroup.style.display = 'block';
            rawGroup.style.display = 'none';
            log(`[Voice_${speaker}] 已切换为 AI 文本朗读模式`);
        } else {
            ttsGroup.style.display = 'none';
            rawGroup.style.display = 'block';
            log(`[Voice_${speaker}] 已切换为本地原声变调模式`);
        }
    }
</script>
