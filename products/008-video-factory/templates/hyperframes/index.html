<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>$title</title>
  <style>
    :root {
      $vars_css
    }
    body { margin: 0; background: var(--color-bg); color: var(--color-fg); font-family: var(--font-body); }
    [data-composition-id="root"] {
      position: relative;
      width: ${width}px;
      height: ${height}px;
      overflow: hidden;
    }
    .clip { position: absolute; inset: 0; }
    .clip.video-clip, .clip.image-clip { object-fit: cover; width: 100%; height: 100%; }
    .clip.text-card {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      /* safe-area：四周留边，避免 9:16 竖屏左右切字 */
      padding: 120px 40px;
      max-width: 85%;
      margin: 0 auto;
      box-sizing: border-box;
      text-align: center;
      gap: 24px;
    }
    .clip.text-card h1 {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 80px;
      line-height: 1.1;
      margin: 0;
      color: var(--color-fg);
      max-width: 100%;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      white-space: normal;
      overflow: visible;
    }
    .clip.text-card .subtitle {
      font-size: 36px;
      margin-top: 24px;
      color: var(--color-accent);
      max-width: 100%;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      white-space: normal;
    }
    .clip.text-card[data-style-kind="hook"] h1 {
      font-size: 104px;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-shadow: 0 8px 0 rgba(0, 0, 0, 0.35);
      word-wrap: break-word;
      overflow-wrap: anywhere;
      white-space: normal;
    }
    .clip.text-card[data-style-kind="hook"] .subtitle {
      font-size: 42px;
      font-weight: 700;
    }
    .clip.text-card .highlight-tag {
      display: inline-block;
      max-width: 100%;
      background: var(--color-tag-bg);
      color: var(--color-tag-fg);
      font-family: var(--font-heading);
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 0.04em;
      padding: 14px 34px;
      border-radius: 12px;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.28);
      transform: rotate(-2deg);
      white-space: normal;
      word-wrap: break-word;
    }
    .overlay-card {
      position: absolute;
      left: 50%;
      bottom: 64px;
      transform: translateX(-50%);
      background: var(--color-card-bg);
      border: 1px solid var(--color-card-border);
      border-radius: 20px;
      padding: 20px 28px;
      backdrop-filter: blur(6px);
      z-index: 3;
    }
    .nutrition-card { width: 560px; }
    .overlay-title {
      font-family: var(--font-heading);
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--color-accent);
    }
    .nutrition-row {
      display: flex;
      justify-content: space-between;
      font-size: 28px;
      padding: 6px 0;
      color: var(--color-fg);
    }
    .nutrition-row b {
      color: var(--color-highlight);
      font-weight: 900;
    }
    .appstore-badge {
      position: absolute;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      background: #000;
      border: 2px solid #fff;
      border-radius: 16px;
      padding: 18px 32px;
      font-family: var(--font-heading);
      font-size: 30px;
      font-weight: 700;
      color: #fff;
      z-index: 3;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
  <div data-composition-id="root" data-start="0" data-duration="$duration" data-width="$width" data-height="$height">
    $scenes
    $audio
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      $tweens
      window.__timelines["root"] = tl;
    </script>
  </div>
</body>
</html>
