<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- 部署到子路径时改成 /video-factory，前端所有 API/静态请求会自动带上前缀 -->
<meta name="vf-base-path" content="" />
<meta name="vf-asset-version" content="__ASSET_VERSION__" />
<meta name="color-scheme" content="dark" />
<title>008 Video Factory Studio</title>
<link rel="stylesheet" href="/css/app.css?v=__ASSET_VERSION__" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Tailwind Play CDN 配置；离线时 app.css 仍保证核心外观可用。
  if (window.tailwind) {
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: { 900: "#06070d", 800: "#0f111b", 700: "#12141f" },
            brand: { 500: "#6d8cff", 400: "#b06dff" },
          },
        },
      },
    };
  }
</script>
</head>
<body>
  <div class="vf-shell">
    <header id="vf-topbar" class="vf-topbar" aria-live="polite"></header>

    <main class="vf-main">
      <section id="vf-inspiration" class="vf-stack" aria-label="Inspiration"></section>
      <section class="vf-stack">
        <div id="vf-storyboard"></div>
        <div id="vf-inspector"></div>
      </section>
    </main>
  </div>

  <div id="vf-toasts" class="vf-toasts" role="status" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px">008 Video Factory Studio 需要启用 JavaScript。</p>
  </noscript>

  <script type="module" src="/js/app.js?v=__ASSET_VERSION__"></script>
</body>
</html>
