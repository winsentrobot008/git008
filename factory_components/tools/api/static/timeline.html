<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZOO · Timeline Editor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d0d; color: #e0e0e0; font-family: 'Segoe UI',system-ui,sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card { background: #1a1a2e; border-radius: 16px; padding: 2rem; width: 640px; max-width: 94vw; box-shadow: 0 0 40px rgba(200,100,255,.12); text-align: center; }
  h1 { font-size: 1.6rem; color: #c99eff; margin-bottom: .5rem; }
  .sub { color: #888; font-size: .9rem; margin-bottom: 2rem; }
  .placeholder-box { border: 2px dashed #333; border-radius: 12px; padding: 3rem 1rem; color: #555; }
  .placeholder-box .icon { font-size: 3rem; margin-bottom: .8rem; }
  .placeholder-box p { font-size: .9rem; }
  .tag { display: inline-block; background: #2a2a4a; color: #b8aaff; border-radius: 6px; padding: .2rem .6rem; font-size: .75rem; margin-top: 1.2rem; }
</style>
</head>
<body>
<div class="card">
  <h1>⏱ Timeline Editor</h1>
  <p class="sub">Scene sequencing & clip trimming — <em>coming soon</em></p>

  <div class="placeholder-box">
    <div class="icon">🎬</div>
    <p>Timeline editor will be built here.<br>
       Drag & drop scenes, adjust duration,<br>
       add transitions between clips.</p>
    <div class="tag">placeholder · under construction</div>
  </div>
</div>
</body>
</html>
